# Reusable: builds the container image for a commit and pushes it to GHCR, tagged with
# the commit SHA. Used by deploy.yml and infra.yml.
name: Build image

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to build
        type: string
        required: true
    outputs:
      image:
        description: Full image reference, ghcr.io/<owner>/<repo>:<sha>
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Image name
        id: name
        # GHCR requires lowercase repository names.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.ref }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
